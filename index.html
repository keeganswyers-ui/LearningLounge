
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Lounge</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10091c;
  color: white;
}
header {
  background: #1d1030;
  padding: 25px;
  text-align: center;
  border-bottom: 2px solid #9333ea;
}
header h1 {
  color: #c084fc;
  font-size: 34px;
  margin: 0;
}
header p {
  color: #c4b5fd;
}
main {
  max-width: 900px;
  margin: 50px auto;
  padding: 20px;
  text-align: center;
}
.welcome {
  background: #211334;
  padding: 40px 20px;
  border-radius: 18px;
  border: 1px solid #9333ea;
}
h2 {
  color: #c084fc;
}
footer {
  text-align: center;
  color: #999;
  padding: 30px;
}
</style>
</head>
<body>

<header>
  <h1>🎮 Learning Lounge</h1>
  <p>Your ultimate gaming destination</p>
</header>

<main>
  <section class="welcome">
    <h2>Welcome to Learning Lounge!</h2>
    <p>Your new favourite place for fun.</p>
    <p>Games coming soon...</p>
  </section>
</main>

<footer>
  Learning Lounge © 2026
</footer>

</body>
</html>
